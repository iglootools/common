# rumdl's defaults, with only what it takes to make them usable. The reasoning is in
# guidelines/project-setup/formatting.md.

[MD013]
# Off by default, which leaves every long line a warning only a hand edit can fix. On, `rumdl fmt`
# rewraps prose to the default 80 columns.
reflow = true
# A code block cannot be rewrapped without changing what it shows: a command, a config file, a
# log line.
code-blocks = false
# A heading cannot be wrapped either, and its text is its anchor: shortening one to fit breaks
# every link to it.
headings = false

[per-file-ignores]
# Claude Code skills and agents open with YAML front matter and a body that has no title of its
# own: Claude Code shows the front matter's name and description instead.
"skills/**/SKILL.md" = ["MD041"]
"agents/*.md" = ["MD041"]
