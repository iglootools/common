[tools]
python = "3.15.2"
uv = "0.13.7"
shellcheck = "0.11.0"
dprint = "0.64.3"
rumdl = "0.3.4"
# Renovate, for lint-renovate and renovate-dry-run (guidelines/project-setup/dependency-automation.md).
# The exclusion exempts one dependency release from mise's no-trust-downgrade check: Yarn's
# lead maintainer published @yarnpkg/libzip@3.2.2 by hand, without the provenance its
# CI-published predecessors carry. Reviewed 2026-11-21: its tarball matches Yarn's source (three
# lines adding parentPath, TypeScript 5.9 typings) and its compiled libzip is byte-identical to
# the attested 3.2.1. Drop the exclusion once Renovate no longer resolves to 3.2.2.
# allow_builds lets re2 alone run its build script: without its native module Renovate falls
# back to JavaScript's regex engine, and lint-renovate would accept custom-manager patterns
# that Renovate itself, which runs RE2, rejects.
"npm:renovate" = { version = "44.239.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"], allow_builds = ["re2"] }
node = "24.22.3"
jq = "1.8.2"

[env]
# Pin uv to the interpreter mise installed, by absolute path: a bare version number does not
# guarantee uv uses it, and may fall back to a system or uv-managed Python of the same
# version. This is also what makes a raised [tools] python pin recreate .venv. See
# guidelines/project-setup/python-tooling.md "Configuration".
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"

[settings]
lockfile = true
# `mise deps` is experimental. Set here rather than in each developer's shell, so a fresh
# clone behaves the same everywhere.
experimental = true
# "source", not "create|source": with [deps.uv] enabled, creating the venv is the deps
# provider's job, and the two collide when both try.
python.uv_venv_auto = "source"

# Runs `uv sync` before every `mise run`, only when uv.lock or pyproject.toml changed or
# .venv is missing. Tasks invoke tools through `uv run --no-sync`, which ignores any other
# project's venv on PATH and leaves installing to this provider.
[deps.uv]
auto = true

[tasks.install]
description = "Install dependencies"
# Delegates to [deps.uv] so there is one definition of how dependencies get installed, and
# one place to change if the experimental deps engine has to be abandoned.
run = "mise deps install uv"

# Task families (guidelines/project-setup/mise.md, "Name tasks by family"): a task that rewrites
# files is named for what it writes (fmt, toc), anything that fails without writing is a lint-*,
# and preflight runs every lint and test before a push.

[tasks.preflight]
description = "Run every lint and every test (what CI runs)"
run = [
  { task = "lint" },
  { task = "test" },
]

# Every test here is fast, so it differs from preflight in name only; it exists so that
# `mise run preflight-quick` works the same in every project.
[tasks.preflight-quick]
description = "Run every lint and the fast tests (here, every test)"
run = [
  { task = "lint" },
  { task = "test" },
]

[tasks.ci-preflight]
description = "Install, then run every lint and test (what the preflight workflow runs)"
run = [
  { task = "install" },
  { task = "preflight" },
]

[tasks.test]
description = "Run the tests"
# -n auto: the tests are isolated (tmp_path, plain values), so they parallelize cleanly.
run = "uv run --no-sync pytest -n auto -v"

# Writers. ruff formats the Python, dprint the JSON, TOML, YAML and Dockerfiles, rumdl the
# Markdown. See guidelines/project-setup/formatting.md.
[tasks.fmt]
description = "Format every file with ruff, dprint and rumdl (rewrites files; lint-fmt verifies only)"
run = [
  { task = "fmt-ruff" },
  { task = "fmt-dprint" },
  { task = "fmt-rumdl" },
]

[tasks.fmt-ruff]
description = "Format the Python with ruff"
run = "uv run --no-sync ruff format ."

[tasks.fmt-dprint]
description = "Format the JSON, TOML, YAML and Dockerfiles with dprint"
run = "dprint fmt"

[tasks.fmt-rumdl]
description = "Format the Markdown with rumdl"
run = "rumdl fmt ."

[tasks.toc]
description = "Regenerate the tables of contents in the Markdown files"
run = "uv run --no-sync iglootools docs toc"

# Lints: each fails without writing anything.
[tasks.lint]
description = "Run every lint"
run = [
  { task = "lint-fmt" },
  { task = "lint-ruff" },
  { task = "lint-shell" },
  { task = "lint-markdown" },
  { task = "lint-types" },
  { task = "lint-boundaries" },
  { task = "lint-dead-code" },
  { task = "lint-lock-mise" },
  { task = "lint-lock-uv" },
  { task = "lint-toc" },
  { task = "lint-renovate" },
]

# The formatters exit 0 whether or not they changed anything, so they cannot be the gate. rumdl
# has no lint-fmt-* of its own: lint-markdown reports what `rumdl fmt` would change along with
# what it cannot fix.
[tasks.lint-fmt]
description = "Check that every file is formatted (fix with `mise run fmt`)"
run = [
  { task = "lint-fmt-ruff" },
  { task = "lint-fmt-dprint" },
]

[tasks.lint-fmt-ruff]
description = "Check that the Python is formatted (fix with `mise run fmt-ruff`)"
run = "uv run --no-sync ruff format --check ."

[tasks.lint-fmt-dprint]
description = "Check that the JSON, TOML, YAML and Dockerfiles are formatted (fix with `mise run fmt-dprint`)"
run = "dprint check"

[tasks.lint-ruff]
description = "Lint the Python with ruff"
run = "uv run --no-sync ruff check ."

[tasks.lint-shell]
description = "Lint the tracked shell scripts with shellcheck"
run = "uv run --no-sync iglootools shell lint"

[tasks.lint-markdown]
description = "Lint the Markdown with rumdl (configured in .rumdl.toml; fix what it can with `mise run fmt-rumdl`)"
run = "rumdl check ."

[tasks.lint-types]
description = "Type-check with pyright"
run = "uv run --no-sync pyright"

[tasks.lint-boundaries]
description = "Check module boundaries (import-linter contracts in pyproject.toml)"
run = "uv run --no-sync lint-imports"

[tasks.lint-dead-code]
description = "Check for unused code (deadcode, configured in pyproject.toml)"
run = "uv run --no-sync deadcode src tests"

[tasks.lint-lock-mise]
description = "Check that mise.lock is up to date with mise.toml"
run = "uv run --no-sync iglootools mise lock-check"

# Asserts uv.lock is consistent with pyproject.toml. --check does not write.
[tasks.lint-lock-uv]
description = "Check that uv.lock is up to date with pyproject.toml"
run = "uv lock --check"

[tasks.lint-toc]
description = "Check that the Markdown tables of contents are up to date (fix with `mise run toc`)"
run = "uv run --no-sync iglootools docs toc --check"

# --strict fails on a config Renovate would migrate, which a plain run reports only as a
# warning. Run with no argument it validates renovate.json as repository config; the presets
# every project extends are validated as files.
[tasks.lint-renovate]
description = "Validate the Renovate config and presets with Renovate's validator, strictly"
run = [
  "renovate-config-validator --strict",
  "renovate-config-validator --strict renovate/base.json renovate/python.json",
]
