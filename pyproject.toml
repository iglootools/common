[project]
name = "iglootools"
description = "Shared build and documentation tools for iglootools projects"
license = "Apache-2.0"
license-files = ["LICENSE"]
# One version for the plugin and the package: read from .claude-plugin/plugin.json below, so
# a release bumps it in one place and the two can never disagree.
dynamic = ["version"]
# A library, so a range (guidelines/project-setup/python-tooling.md "Target the latest stable
# Python, unless others install the package"): the package installs into each consumer's
# environment, and photree is held on 3.14 by onnxruntime (no cp315 wheels); nbkp runs it on
# 3.15. mise.toml develops and CI tests on 3.15, while ruff and pyright target the 3.14 floor, so
# 3.15-only syntax and standard-library APIs fail the checks. What they cannot see, a behaviour
# that differs on 3.14, shows up in photree's CI instead. Narrow to ">=3.15,<3.16", and move
# ruff's and pyright's targets to 3.15, when photree moves to 3.15.
requires-python = ">=3.14,<3.16"
dependencies = [
  "typer>=0.27.0,<1.0.0",
  # Imported directly for console output, not only through typer, so its major is bounded
  # here rather than left to whatever typer allows.
  "rich>=15,<16",
  # docs depgraph: pydeps analyses the imports, mermaid-ascii-diagrams renders --format ascii.
  # pydeps also needs graphviz's `dot`, a system package mise does not provide.
  "pydeps>=3.0.7,<4.0",
  "mermaid-ascii-diagrams>=0.1.1,<0.2",
]

[project.scripts]
iglootools = "iglootools.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.17,<0.18",
  "pyright>=1.1,<2.0",
  "pytest>=9.2.0,<10.0",
  "pytest-xdist>=3.5.0,<4.0",
  "import-linter>=2.15,<3.0",
  "deadcode>=2.7.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Not uv-dynamic-versioning, unlike nbkp and photree: the version is the plugin's, set by
# hand in the release pull request, so there is no git-derived version and no 0.0.0
# fallback for build-verify to guard against.
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version": "(?P<version>[^"]+)"'

# guidelines/project-setup/python-tooling.md › Tell hatchling what to package.
[tool.hatch.build.targets.wheel]
packages = ["src/iglootools"]

# Hatchling's sdist default is every file git does not ignore: the guidelines, skills and
# workflows. Projects install from git, which builds from the source tree, so the sdist only
# needs the package.
[tool.hatch.build.targets.sdist]
only-include = ["src/iglootools", ".claude-plugin/plugin.json"]

# guidelines/project-setup/python-tooling.md › Tell hatchling what to package.
[tool.hatch.build]
exclude = [".DS_Store"]

[tool.uv]
# Replaces the default [{ file = "pyproject.toml" }]: the version lives in plugin.json, so
# without it a version bump leaves the editable install reporting the old one.
cache-keys = [{ file = "pyproject.toml" }, { file = ".claude-plugin/plugin.json" }]

# guidelines/project-setup/python-tooling.md › Pin the build backend explicitly. Regenerate with:
#   printf '%s\n' hatchling | uv pip compile - --no-annotate --no-header --quiet
build-constraint-dependencies = [
  "hatchling==1.33.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomlkit==0.15.2",
  "trove-classifiers==2026.9.21.13",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Every rule, minus those our conventions are against: docs/architecture-decision-record.md,
# ADR-003, gives the reason for each entry below. preview turns on PLW1514 (still a
# preview rule); explicit-preview-rules keeps ALL from selecting the other preview rules.
preview = true
explicit-preview-rules = true
select = ["ALL"]
extend-select = ["PLW1514"]
# The guidelines' document-to-section separator, and curly quotes as test input.
allowed-confusables = ["›", "’", "“", "”"]
ignore = [
  # Each is the opposite of a D rule we keep: D211 and D213.
  "D203",
  "D212",
  # The LICENSE file covers every file.
  "CPY001",
  # Imports stay at module level, never in a TYPE_CHECKING block.
  "TC001",
  "TC002",
  "TC003",
  # The explicit else python.md asks for.
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  # They count each case of a match.
  "C901",
  "PLR0911",
  "PLR0912",
  # Keyword seams add parameters by design; PLR0917 still caps positional ones.
  "PLR0913",
  # A command is an argument list, its program found on PATH.
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks; pytest asserts with assert; a test's literals are its
# specification; its "secrets" are fakes or keyring entry names. S108 stays on: a test
# writes under tmp_path, never /tmp.
"tests/**" = ["D1", "PLR2004", "S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-statements = 30

# Keeps aliased re-imports in the same `from x import (a, b as c)` block instead of a
# separate import statement per alias.
[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Inject a fake through a parameter instead of patching (general.md, Testability)."
"pytest.MonkeyPatch".msg = "Inject a fake through a parameter instead of patching (general.md, Testability)."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
# guidelines/project-setup/ide.md › Pin the venv for pyright in [tool.pyright].
venvPath = "."
venv = ".venv"

# Module boundaries, enforced by `mise run lint-boundaries` (part of `lint`). The core
# modules return data and raise structured errors; only the cli modules present them.
[tool.importlinter]
root_package = "iglootools"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the CLI modules use Typer and Rich"
type = "protected"
protected_modules = ["typer", "rich"]
allowed_importers = ["iglootools.cli", "iglootools.cliwiring", "iglootools.*.cli"]

[[tool.importlinter.contracts]]
name = "Only the CLI modules use the shared CLI wiring"
type = "protected"
protected_modules = ["iglootools.cliwiring"]
allowed_importers = ["iglootools.cli", "iglootools.*.cli"]

# Unused code, enforced by `mise run lint-dead-code` (part of `lint`). Each entry is code
# that runs without being named in the project, so the scan cannot see it used.
[tool.deadcode]
ignore-names-if-decorated-with = [
  "@*.command", # Typer registers commands and callbacks by decorator
  "@*.callback",
  "@pytest.fixture", # pytest injects fixtures by parameter name
]
ignore-names = [
  "main", # the [project.scripts] entry point
]
