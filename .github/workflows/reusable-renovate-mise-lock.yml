name: reusable-renovate-mise-lock

# Renovate's hosted runner has no `mise` binary, so it can bump tool versions in mise.toml but
# cannot regenerate mise.lock — the per-platform checksum and attestation lockfile. That leaves
# the renovate/artifacts check red on every tool bump. This workflow runs mise on Renovate
# branches to regenerate the lock and commit it back if it changed.
#
# It regenerates uv.lock as well, in a project that has one. Renovate does update uv.lock for the
# dependencies its pep621 manager extracts, but not for a pin a regex custom manager bumps — and
# `[tool.uv] build-constraint-dependencies` is pinned exactly that way, while uv.lock records those
# constraints in its `[manifest]`. Without this step every build-backend bump leaves uv.lock stale,
# and CI's `UV_LOCKED=1` rejects the branch before a single test runs.
#
# And it runs dprint, in a project that has a dprint.json. Renovate rewrites mise.toml,
# dprint.json, renovate.json and the workflows in its own style, which `dprint check` can reject,
# leaving the branch red until someone runs `mise run fmt` on it by hand. The workflow keeps
# its name because renaming it would break every caller's `uses:` ref.
#
# The caller keeps what is genuinely its own: the push trigger, the concurrency group, the
# `contents: write` grant and the mise version. `permissions` in a called workflow is a ceiling
# on what the caller granted rather than a grant of its own, so a caller that omits
# `contents: write` gets a job that regenerates the lock and then cannot push it.
#
# It pushes with a token of the iglootools GitHub App the caller passes as `app-client-id` and
# `app-private-key`, not with GITHUB_TOKEN. GitHub holds every pull_request run that a
# GITHUB_TOKEN push to a pull request's branch triggers until someone approves it, so the
# project's preflight on the regenerated lock waited by hand on every Renovate pull request. A
# push with an app's token triggers runs as usual. Without the secrets, it falls back to
# GITHUB_TOKEN with a warning: the lock is still pushed, and preflight waits for approval as
# before.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          mise version for jdx/mise-action, pinned by the caller because project-setup/workflows.md
          requires it to match the version the project's mise.lock was generated with.
          Deliberately named `version` rather than `mise-version`: the Renovate custom manager
          that keeps the pin current matches a `# renovate:` marker followed by whitespace and a
          literal `version:` line, so any other name yields a pin nothing updates.
        type: string
        required: true
    secrets:
      app-client-id:
        description: >-
          Client ID of the GitHub App the regenerated lock is pushed as, installed on the caller's
          repository with Contents read and write. Optional: without it the push uses
          GITHUB_TOKEN, and the preflight it triggers waits for approval.
        required: false
      app-private-key:
        description: The private key of that GitHub App.
        required: false

jobs:
  mise-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # committing the regenerated lock files back to the Renovate branch
    # Secrets cannot appear in a step's `if:`, so whether the app is configured is read here.
    env:
      HAS_APP: ${{ secrets.app-client-id != '' && secrets.app-private-key != '' }}
    steps:
      # Scoped to the calling repository (the default) and to the one permission the push needs.
      # The token is revoked when the job ends.
      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Warn that the push will wait for approval
        if: env.HAS_APP != 'true'
        run: >-
          echo "::warning::No app-client-id and app-private-key: pushing with GITHUB_TOKEN, so
          the preflight run it triggers waits for approval.
          See guidelines/project-setup/shared-workflows.md in iglootools/common."

      # Checkout persists the token in the git config, which is what `git push` below uses.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Install the mise binary only. We must NOT let mise-action run its default
      # `mise install`: when a mise.lock is present it auto-adds `--locked`, which *fails* on a
      # tool version that is in mise.toml but not yet in the lock — exactly the case this
      # workflow exists to fix. So we regenerate explicitly.
      #
      # `env: false` follows from that and is not optional. mise-action exports mise's [env]
      # into the job after setup, and any [env] entry resolving a tool path — the
      # `UV_PYTHON = "{{ tools.python.path }}"` pin python-tooling.md requires, or any other
      # `{{ tools.* }}` template — fails with "Field `<tool>` is not defined" when nothing is
      # installed, which is precisely the state `install: false` leaves behind, taking the whole
      # setup step down with it. A project with no such template survives without `env: false`,
      # which is how the pairing gets dropped from a copy and stays latent until someone adds an
      # [env] entry. The export buys nothing here regardless: `mise lock` needs the binary and the
      # config, not a tool environment, and the uv.lock step restates the one variable it needs.
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          version: ${{ inputs.version }}
          install: false
          env: false

      - name: Regenerate mise.lock
        run: mise lock

      # Runs after `mise lock`, so the install resolves against the regenerated lock — a uv or
      # Python bump on the same branch is then locked before it is installed. Only uv and Python:
      # nothing else in the toolset is needed to lock.
      - name: Install uv and Python
        if: hashFiles('uv.lock') != ''
        run: mise install uv python

      # uv is invoked by path rather than through `mise exec`/`mise run`, which would trigger the
      # project's `[deps.uv]` auto-sync and build the project for no purpose. `env: false` above
      # means mise's [env] is not exported, so the interpreter pin python-tooling.md requires is
      # restated here: without it uv may resolve on the runner's own Python or download one.
      - name: Regenerate uv.lock
        if: hashFiles('uv.lock') != ''
        run: |
          UV_PYTHON="$(mise which python)" UV_PYTHON_DOWNLOADS=never "$(mise which uv)" lock

      # Last, so it also formats anything the steps above wrote. Only dprint is installed, and by
      # path rather than through `mise exec` for the same reason as uv. rumdl is left out:
      # Renovate does not edit Markdown.
      - name: Format with dprint
        if: hashFiles('dprint.json') != ''
        run: |
          mise install dprint
          "$(mise which dprint)" fmt

      # Stages whatever the steps above changed: a project without uv has no uv.lock, and dprint
      # may touch any file it formats. `git add --all` rather than the tracked files alone, because
      # `mise lock` writes an npm tool's dependency lock to a new directory under .mise/locks/ when
      # the tool's version moves, and deletes the old one; mise.lock pins it by digest, so leaving
      # the new one out breaks every locked install. Nothing else the steps write is tracked or
      # outside .gitignore.
      - name: Commit changes if any
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Lock files are up to date and everything is formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate lock files and format"
          git push
